# TBO Copilot release pipeline
#
# Builds TBO Copilot installers for macOS (Apple Silicon; Intel optional) and
# Windows x64.
#
# Triggers:
#   - Tag `tbo-v<version>` (e.g. tbo-v0.16.1), where <version> is the version in
#     apps/desktop/package.json. A rebuild of the same version uses a suffix:
#     tbo-v0.16.1-2. Tag builds publish a GitHub Release in this (private)
#     repository with the installers attached.
#   - Actions → TBO Release → Run workflow: a test build. Installers are kept as
#     workflow artifacts for 14 days; no release is created.
#   - A pull request into `tbo` that changes this workflow: the same test build,
#     so workflow changes are proven before they merge.
#
# Signing is optional and not configured yet. Installers are unsigned; macOS
# builds are ad-hoc signed so they run on Apple Silicon. docs/tbo/README.md
# explains how staff open them and how to add real signing later.
#
# Upstream's release workflow (release.yml) is disabled in this repository's
# Actions settings: it signs with upstream's Apple team and expects PI-Desktop
# artifact names. Its file stays unchanged so upstream merges stay clean.
#
# This repository is on GitHub Free: macOS runner minutes count about 10x and
# Windows about 2x against the monthly allowance, so Intel macOS is opt-in.

name: TBO Release

on:
  push:
    tags: ['tbo-v*']
  pull_request:
    branches: [tbo]
    paths:
      - '.github/workflows/tbo-release.yml'
  workflow_dispatch:
    inputs:
      macos_intel:
        description: 'Also build macOS Intel (x64). Uses extra macOS minutes.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tbo-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (branding / build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/tbo-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#tbo-v}"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          case "$tag" in
            "$version" | "$version"-[0-9]*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version."
              echo "::error::Use tbo-v$version, or tbo-v$version-<n> for a rebuild of the same version."
              exit 1
              ;;
          esac

      - name: Select build targets
        id: matrix
        env:
          MACOS_INTEL: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos_intel) || vars.TBO_BUILD_MACOS_INTEL == 'true' }}
        run: |
          set -euo pipefail
          targets='[
            {"name":"macOS arm64","os":"macos-15","arch":"arm64","runner_arch":"arm64","artifact":"mac-arm64","platform":"macos"},
            {"name":"Windows x64","os":"windows-latest","arch":"x64","runner_arch":"","artifact":"windows-x64","platform":"windows"}
          ]'
          if [ "$MACOS_INTEL" = "true" ]; then
            targets="$(jq -c '. + [{"name":"macOS Intel x64","os":"macos-15-intel","arch":"x64","runner_arch":"x86_64","artifact":"mac-x64","platform":"macos"}]' <<<"$targets")"
          fi
          echo "matrix=$(jq -c '{include: .}' <<<"$targets")" >> "$GITHUB_OUTPUT"
          jq -r '.[].name' <<<"$targets"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check TBO branding
        run: node scripts/tbo/apply-branding.mjs --check

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Typecheck Desktop
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Rust host-core test
        run: cargo test -p host-core --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Verify native runner architecture
        # The macOS app and its Rust host-core sidecar must be built for the
        # same architecture. Windows cross-builds from any runner.
        if: matrix.runner_arch != ''
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          if [ "$actual_arch" != "${{ matrix.runner_arch }}" ]; then
            echo "::error::Expected ${{ matrix.runner_arch }} runner, got $actual_arch."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles.
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      # Arguments go straight after the script name, without `--`: pnpm 12
      # passes a literal `--` through to the script, and electron-builder then
      # ignores every option after it (architecture, signing identity).

      - name: Package Windows installers
        if: matrix.platform == 'windows'
        # Builds the NSIS installer, the portable EXE and the ZIP. The dist
        # script passes --publish never, so electron-builder never publishes.
        run: pnpm --filter @pi-desktop/desktop run dist:win --${{ matrix.arch }}

      - name: Package macOS installers (ad-hoc signed)
        if: matrix.platform == 'macos'
        env:
          # No Developer ID yet: never pick up a certificate from the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # identity "-" asks electron-builder for an ad-hoc signature. Without
        # it the app is not signed at all and Apple Silicon reports it as
        # damaged. The entitlements already allow ad-hoc signed libraries.
        run: pnpm --filter @pi-desktop/desktop run dist:mac --${{ matrix.arch }} -c.mac.identity=-

      - name: Verify artifact names
        run: |
          set -euo pipefail
          shopt -s nullglob
          release=apps/desktop/release
          if [ "${{ matrix.platform }}" = "macos" ]; then
            expected=("$release"/TBO-Copilot-*-${{ matrix.arch }}.dmg "$release"/TBO-Copilot-*-${{ matrix.arch }}-mac.zip)
          else
            expected=("$release"/TBO-Copilot-Setup-*.exe "$release"/TBO-Copilot-Portable-*.exe "$release"/TBO-Copilot-Portable-*.zip)
          fi
          for pattern_result in "${expected[@]}"; do
            echo "found: $pattern_result"
          done
          want=$([ "${{ matrix.platform }}" = "macos" ] && echo 2 || echo 3)
          if [ "${#expected[@]}" -ne "$want" ]; then
            echo "::error::Expected $want TBO Copilot installers, found ${#expected[@]}."
            ls -la "$release" || true
            exit 1
          fi

      - name: Check the macOS ad-hoc signature
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          app="$(find apps/desktop/release -maxdepth 2 -name 'TBO Copilot.app' -type d | head -1)"
          if [ -z "$app" ]; then
            echo "::error::TBO Copilot.app not found in apps/desktop/release"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Signature" || true

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: tbo-copilot-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            apps/desktop/release/TBO-Copilot-*.dmg
            apps/desktop/release/TBO-Copilot-*.zip
            apps/desktop/release/TBO-Copilot-*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/tbo-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List installers
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: TBO Copilot ${{ github.ref_name }}
          files: dist/*
          body: |
            TBO Copilot ${{ github.ref_name }}, built from commit ${{ github.sha }}.

            These installers are **not signed yet**:
            - **macOS:** open the DMG and drag TBO Copilot to Applications. The first time, right-click the app → Open → Open.
              If macOS says the app is damaged, run `xattr -dr com.apple.quarantine "/Applications/TBO Copilot.app"` once.
            - **Windows:** run `TBO-Copilot-Setup-*.exe`. If SmartScreen appears, choose More info → Run anyway.

            Updates are off in this build: install new versions by hand.
